name: Build binaries

on:
  workflow_call:
    inputs:
      publish-tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      publish-tag:
        required: true
        type: string

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  build-and-upload-binary:
    permissions:
      contents: write
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-latest
        - target: x86_64-pc-windows-msvc
          os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: oxc-project/setup-rust@12a52e3caf7bac9d8b9ca550a82c425ed6343aee # v1.0.18
      with:
        cache-key: build-${{ matrix.target }}
        save-cache: ${{ github.ref_name == 'main' }}

    - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
      with:
        bin: client
        target: ${{ matrix.target }}
        ref: refs/tags/${{ inputs.publish-tag }}
        tar: all
        zip: windows
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        CARGO_PROFILE_RELEASE_LTO: true

    - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
      with:
        bin: server
        target: ${{ matrix.target }}
        ref: refs/tags/${{ inputs.publish-tag }}
        tar: all
        zip: windows
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        CARGO_PROFILE_RELEASE_LTO: true
